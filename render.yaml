services:
  - type: web
    name: ai-career-agent-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:///./data/dev.db
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: GEMINI_MODEL
        value: gemma-4-26b
      - key: LLM_QUEUE_ENABLED
        value: "True"
      - key: LLM_REQUESTS_PER_MINUTE
        value: "12"
      - key: LLM_MAX_RETRIES
        value: "3"
      - key: AUTH_SECRET_KEY
        value: change-this-secret-before-deploying
      - key: AUTH_TOKEN_EXPIRE_MINUTES
        value: "1440"
